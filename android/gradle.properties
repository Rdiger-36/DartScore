org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Take the barcode model out of the app and let Play Services supply it.
# Bundled, it costs around 20 MB of the download for a screen most users open
# once, when they move to a new device. Unbundled it is a few hundred KB, at
# the price of the model being fetched before the first scan; the DEPENDENCIES
# meta-data in AndroidManifest.xml asks for that at install time, so in
# practice it is already there by the time anyone scans.
dev.steenbakker.mobile_scanner.useUnbundled=true
