org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Cannot go to true yet, though Flutter warns that a future version will refuse
# to build an app whose plugins apply the Kotlin Gradle Plugin. Two things have
# to land first, neither of them here:
#   * built-in Kotlin needs Flutter 3.47, and this project builds on 3.44
#   * flutter_plugin_android_lifecycle, pulled in transitively by image_picker,
#     still trips AGP 9 built-in Kotlin. Setting the flag fails the build in
#     that module before anything of ours is compiled.
# What was in reach is done: mobile_scanner, package_info_plus and share_plus
# are held at versions that stop applying KGP, so only the transitive one is
# left. Try the flag again after a Flutter upgrade; if the build still dies in
# flutter_plugin_android_lifecycle, the fix is upstream.
android.builtInKotlin=false
# Take the barcode model out of the app and let Play Services supply it.
# Bundled, it costs around 20 MB of the download for a screen most users open
# once, when they move to a new device. Unbundled it is a few hundred KB, at
# the price of the model being fetched before the first scan; the DEPENDENCIES
# meta-data in AndroidManifest.xml asks for that at install time, so in
# practice it is already there by the time anyone scans.
dev.steenbakker.mobile_scanner.useUnbundled=true
